configuration:
  instance_name:
    name: Instance name
    description: >-
      How this Home Assistant host appears in the Antigravity Remote Control
      instance list at antigravity.google.com.
  mode:
    name: Mode
    description: >-
      daemon = always-on headless Remote Control host (recommended).
      interactive = runs `agy --remote-control` in a tmux session you can
      attach to from the panel; use this if daemon mode does not work.
  auto_update:
    name: Auto-update CLI
    description: Let the Antigravity CLI update itself in the background.
  manage_agents_md:
    name: Manage agent rules
    description: >-
      Regenerate ~/.gemini/AGENTS.md on start with Home Assistant context
      (paths, Supervisor API usage, safety rules).
  enable_ha_mcp:
    name: Home Assistant MCP server
    description: >-
      Install ha-mcp (github.com/homeassistant-ai/ha-mcp) and register it as
      the 'home-assistant' MCP server so the agent can query entities, manage
      automations, dashboards, etc. natively.
  debug:
    name: Debug logging
    description: Log extra diagnostics from the add-on scripts.
  local_web_ui:
    name: Local web UI (experimental)
    description: >-
      Serve the Antigravity web UI on port 8765 using the CLI's undocumented
      hub mode, behind basic auth. Requires web_ui_password. Do not expose to
      the internet.
  web_ui_username:
    name: Web UI username
    description: Basic-auth username for the local web UI.
  web_ui_password:
    name: Web UI password
    description: Basic-auth password for the local web UI (required to enable it).
  ssl:
    name: SSL
    description: Serve the local web UI over HTTPS using the certificate below.
  certfile:
    name: Certificate file
    description: Certificate file in /ssl (used when SSL is enabled).
  keyfile:
    name: Key file
    description: Private key file in /ssl (used when SSL is enabled).
network:
  8765/tcp: Experimental local web UI (only active when local_web_ui is enabled)
