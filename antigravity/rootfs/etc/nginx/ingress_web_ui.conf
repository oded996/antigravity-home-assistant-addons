# EXPERIMENTAL: ingress panel = Antigravity web UI (agy hub).
#
# The hub's single-page app assumes it is served at the root of its own
# origin. Home Assistant serves ingress under /api/hassio_ingress/<token>/,
# so we rewrite the responses on the fly:
#   - asset URLs in index.html get the ingress prefix,
#   - an inline script records the prefix in window.__HA_INGRESS__ and strips
#     it from the iframe URL so the client-side router sees "/",
#   - API / websocket / artifact URLs in main.js get the prefix.
# $http_x_ingress_path is set by the Supervisor ingress gateway.
# ${dollar} is a literal "$" (nginx has no escape for it).

# Setup console stays reachable under /terminal/.
location /terminal/ {
    proxy_pass http://ttyd/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_buffering off;
}

location / {
    include /etc/nginx/hub_proxy.conf;
    proxy_set_header Accept-Encoding "";

    sub_filter_once off;
    sub_filter_types application/javascript text/javascript;

    # index.html
    sub_filter '<script>window.__APP_CONFIG__' '<script>window.__HA_INGRESS__="$http_x_ingress_path";(function(b){var p=location.pathname;if(b&&p.indexOf(b)===0){history.replaceState(history.state,"",(p.slice(b.length)||"/")+location.search+location.hash)}})(window.__HA_INGRESS__);</script><script>window.__APP_CONFIG__';
    sub_filter 'href="/' 'href="$http_x_ingress_path/';
    sub_filter 'src="/' 'src="$http_x_ingress_path/';
    sub_filter '</body>' '<a href="$http_x_ingress_path/terminal/" title="Setup terminal (agy-login, agy-status)" style="position:fixed;left:6px;bottom:6px;z-index:2147483647;opacity:.4;font:11px monospace;text-decoration:none;background:#444;color:#fff;padding:1px 5px;border-radius:4px">&gt;_</a></body>';

    # main.js
    sub_filter 'window.location.origin' '(window.location.origin+(window.__HA_INGRESS__||""))';
    sub_filter '/connect-websocket`' '${dollar}{window.__HA_INGRESS__||""}/connect-websocket`';
    sub_filter '`/static/artifacts/' '`${dollar}{window.__HA_INGRESS__||""}/static/artifacts/';
    sub_filter '`/workers/' '`${dollar}{window.__HA_INGRESS__||""}/workers/';
}
