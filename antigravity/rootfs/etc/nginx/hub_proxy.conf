# Common settings for proxying to the Antigravity hub (127.0.0.1:18765).
# The hub only trusts its own origin, so present requests as local.
proxy_pass http://127.0.0.1:18765;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host 127.0.0.1:18765;
proxy_set_header Origin http://127.0.0.1:18765;
proxy_set_header Authorization "";
proxy_read_timeout 1d;
proxy_send_timeout 1d;
proxy_buffering off;
