user root;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_max_body_size 16m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Literal "$" for sub_filter replacements (nginx has no escape for it).
    geo $dollar {
        default "$";
    }

    upstream ttyd {
        server unix:/run/ttyd.sock;
    }

    server {
        listen 7681 default_server;

        # Only the Home Assistant ingress gateway may reach the setup console.
        allow 172.30.32.2;
        deny all;

        # ingress_terminal.conf (default) or ingress_web_ui.conf, chosen by
        # init-antigravity via the ingress_panel option.
        include /etc/nginx/ingress.conf;
    }

    # Experimental local web UI on :8765, generated by init-antigravity
    # (empty unless local_web_ui is enabled and a password is set).
    include /etc/nginx/web_ui.conf;
}
