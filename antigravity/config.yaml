name: Antigravity for Home Assistant
version: "0.3.1"
slug: antigravity
description: >-
  Run the Google Antigravity agent on your Home Assistant host and drive it
  from any browser via Antigravity Remote Control.
url: https://github.com/oded996/antigravity-home-assistant-addons
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 7681
panel_icon: mdi:rocket-launch-outline
panel_title: Antigravity
homeassistant_api: true
hassio_api: true
hassio_role: homeassistant
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: Experimental local web UI (enable local_web_ui first)
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: all_addon_configs
    read_only: false
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: ssl
    read_only: true
  - type: backup
    read_only: true
options:
  instance_name: home-assistant
  mode: daemon
  auto_update: true
  manage_agents_md: true
  enable_ha_mcp: true
  debug: false
  ingress_panel: terminal
  local_web_ui: false
  web_ui_username: admin
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  instance_name: str
  mode: list(daemon|interactive)
  auto_update: bool
  manage_agents_md: bool
  enable_ha_mcp: bool
  debug: bool
  ingress_panel: list(terminal|web_ui)
  local_web_ui: bool
  web_ui_username: str
  web_ui_password: password?
  ssl: bool
  certfile: str
  keyfile: str
